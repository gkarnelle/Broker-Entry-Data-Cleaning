
name: Update GaiAnQi Broker Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *"

permissions:
  contents: write

jobs:
  update-broker-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate synthetic broker submissions
        run: python src/generate_broker_data.py

      - name: Clean and validate broker submissions
        run: python src/clean.py

      - name: Reconcile against customs entry records
        run: python src/reconcile.py

      - name: Commit updated data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/raw/ data/processed/

          if ! git diff --cached --quiet; then
            git commit -m "chore: Refresh GaiAnQi broker quality reports"
            git push
          else
            echo "No data changes to commit"
          fi
